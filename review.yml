name: Nexamp
description: API Evangelist contract-discovery review of Nexamp's public surface.
url: https://raw.githubusercontent.com/api-evangelist/nexamp/refs/heads/main/review.yml
created: '2026-08-01'
modified: '2026-08-01'
reviews:
- date: '2026-08-01'
  rating: 0
  summary: >-
    Nexamp publishes no public API program. Full STEP 0b contract discovery was run against
    every host that resolves for the nexamp.com domain and every plausible developer host,
    and every probe missed. There is no OpenAPI/Swagger document, no GraphQL endpoint, no
    AsyncAPI or webhook catalogue, no MCP server, no A2A agent card, no /.well-known/
    discovery surface, no llms.txt, no SDK in any public package registry, and no
    developer/docs subdomain (developer.nexamp.com and docs.nexamp.com do not resolve at
    all). The Nexamp GitHub organisation (github.com/Nexamp, org id 38884452, created as a
    real org with the nexamp.com blog URL set) exists but publishes ZERO public
    repositories. Nexamp is a vertically integrated clean-energy developer/operator whose
    software is delivered as end-user products — the community.nexamp.com subscriber portal
    and the portal.nexamp.com Decarbonization Platform — not as a developer platform.
    KEY FINDING — an undocumented API host does exist: api.nexamp.com resolves to Azure App
    Service (nexamp-api-production.azurewebsites.net). Its root and most paths 302 to
    login.microsoftonline.com, i.e. it is gated behind Microsoft Entra ID; /openapi.json,
    /swagger.json, /swagger/v1/swagger.json and every /.well-known/ path return 401. It is
    an internal/partner API, not a public one. It also serves an EXPIRED TLS certificate:
    the Sectigo-issued wildcard CN=*.nexamp.com expired 2024-05-14, so every probe of that
    host required certificate verification to be disabled. That is a real, currently-live
    security defect on a production Nexamp host and is recorded in
    security/nexamp-domain-security.yml.
    NOTE ON FALSE POSITIVES — community.nexamp.com is an Azure Static Web Apps SPA whose
    catch-all route answers HTTP 200 with the application HTML shell for every path,
    including /.well-known/agent-card.json and /llms.txt. Those 200s are NOT documents and
    were explicitly rejected; no agent card was written.
    Per the no-fabrication rule, no OpenAPI, AsyncAPI, agent card, MCP manifest, packages
    file, or scopes file was authored. Re-evaluate if Nexamp launches a partner/developer
    programme for its Decarbonization Platform.
