aid: nexamp
name: Nexamp
description: 'Nexamp is a Boston-based clean energy company, founded in 2007 by two
  U.S. Army veterans, that develops, builds, owns and operates distributed solar generation
  and battery storage across the United States and is one of the country''s largest
  fully integrated community solar providers. The company runs end-to-end: project
  development and acquisition, engineering and design, construction, asset operations,
  and subscriber management for residential and commercial community solar customers,
  alongside power purchase agreements, land leasing for solar farm hosts, energy storage,
  and standalone development and asset-management services. Customer-facing software
  is delivered through the community.nexamp.com subscriber portal and the portal.nexamp.com
  Decarbonization Platform. As of the 2026-08-01 enrichment pass Nexamp publishes no
  public developer program, API documentation, SDKs, or machine-readable API contract;
  the api.nexamp.com host that exists is gated behind Microsoft Entra ID and is not
  publicly documented.'
